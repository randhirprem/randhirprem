<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="600" style="background-color: #02060F; font-family: monospace;">
  <defs>
    <!-- Heavy Neon Glow Filter -->
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Base Hexagon Node -->
    <polygon id="hex" points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11" fill="#02060F" stroke-width="2.5" />

    <!-- Subtle Dot Grid Pattern -->
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#1A2B4C" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- BACKGROUND -->
  <rect width="100%" height="100%" fill="url(#dots)" />

  <!-- DYNAMIC SYSTEM LOAD BARS (Top Right) -->
  <g transform="translate(850, 30)">
    <text x="0" y="-10" fill="#00F0FF" font-size="10" letter-spacing="1">SYSTEM LOAD</text>
    <rect x="0" y="0" width="120" height="4" fill="#163A5E" />
    <rect x="0" y="0" width="100" height="4" fill="#00F0FF" filter="url(#neon)">
       <animate attributeName="width" values="100; 40; 110; 80; 100" dur="4s" repeatCount="indefinite" />
    </rect>
    
    <rect x="0" y="10" width="120" height="4" fill="#163A5E" />
    <rect x="0" y="10" width="60" height="4" fill="#FF8800" filter="url(#neon)">
       <animate attributeName="width" values="60; 90; 30; 120; 60" dur="2.5s" repeatCount="indefinite" />
    </rect>
    
    <rect x="0" y="20" width="120" height="4" fill="#163A5E" />
    <rect x="0" y="20" width="85" height="4" fill="#B800FF" filter="url(#neon)">
       <animate attributeName="width" values="85; 110; 60; 90; 85" dur="3.5s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- TOP LEFT HEADER -->
  <text x="40" y="40" fill="#FFFFFF" font-size="18" font-weight="bold" letter-spacing="2" filter="url(#neon)">
    RANDHIR_PREM // STATUS: ONLINE
    <animate attributeName="opacity" values="1;1;1;0;1;1;1;0.5;1;1" dur="6s" repeatCount="indefinite"/>
  </text>
  <text x="40" y="60" fill="#00F0FF" font-size="10" letter-spacing="1">DEPLOYMENT TOPOLOGY MATRIX V2.5</text>

  <!-- CIRCUIT BOARD TRACES (Paths) -->
  <g fill="none" stroke="#163A5E" stroke-width="2.5">
    <!-- Homelab to Central Routing Relay -->
    <path id="p_main" d="M 250,300 L 500,300" />
    
    <!-- Relay to 9enjin (Top) with Chamfered Corners -->
    <path id="p_9enjin" d="M 500,300 L 500,170 L 520,150 L 750,150" />
    
    <!-- Relay to 10 Year Series (Middle) -->
    <path id="p_10ys" d="M 500,300 L 750,300" />
    
    <!-- Relay to Foremost WMS (Bottom) with Chamfered Corners -->
    <path id="p_wms" d="M 500,300 L 500,430 L 520,450 L 750,450" />
  </g>

  <!-- STATIC HARDWARE ACCENTS ON TRACES -->
  <rect x="330" y="297" width="20" height="6" fill="#163A5E" />
  <rect x="400" y="297" width="10" height="6" fill="#163A5E" />
  <rect x="497" y="220" width="6" height="25" fill="#163A5E" />
  <rect x="497" y="355" width="6" height="25" fill="#163A5E" />
  <rect x="600" y="147" width="30" height="6" fill="#163A5E" />
  <rect x="650" y="297" width="15" height="6" fill="#163A5E" />
  <rect x="620" y="447" width="25" height="6" fill="#163A5E" />

  <!-- ANIMATED DATA PACKETS -->
  <g fill="#FFFFFF" filter="url(#neon)">
    <!-- Main Trunk Packets -->
    <circle r="4"><animateMotion dur="1.5s" repeatCount="indefinite" path="M 250,300 L 500,300" begin="0s"/></circle>
    <circle r="4"><animateMotion dur="1.5s" repeatCount="indefinite" path="M 250,300 L 500,300" begin="0.7s"/></circle>
    
    <!-- 9enjin Packets -->
    <circle r="3.5"><animateMotion dur="2s" repeatCount="indefinite" path="M 500,300 L 500,170 L 520,150 L 750,150" begin="0.5s"/></circle>
    <circle r="3.5"><animateMotion dur="2s" repeatCount="indefinite" path="M 500,300 L 500,170 L 520,150 L 750,150" begin="1.5s"/></circle>
    
    <!-- 10 Year Series Packets -->
    <circle r="3.5"><animateMotion dur="1.5s" repeatCount="indefinite" path="M 500,300 L 750,300" begin="0.2s"/></circle>
    <circle r="3.5"><animateMotion dur="1.5s" repeatCount="indefinite" path="M 500,300 L 750,300" begin="1.0s"/></circle>
    
    <!-- Foremost WMS Packets -->
    <circle r="3.5"><animateMotion dur="2s" repeatCount="indefinite" path="M 500,300 L 500,430 L 520,450 L 750,450" begin="0.8s"/></circle>
    <circle r="3.5"><animateMotion dur="2s" repeatCount="indefinite" path="M 500,300 L 500,430 L 520,450 L 750,450" begin="1.8s"/></circle>
  </g>

  <!-- CENTRAL ROUTING RELAY (Radar Pulse) -->
  <g transform="translate(500, 300)">
    <!-- Ping Rings -->
    <circle cx="0" cy="0" r="10" fill="none" stroke="#00F0FF" stroke-width="2" opacity="0">
       <animate attributeName="r" values="10; 80" dur="2.5s" repeatCount="indefinite" />
       <animate attributeName="opacity" values="0.8; 0" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <!-- Rotating Dashed Dial -->
    <circle cx="0" cy="0" r="30" fill="none" stroke="#163A5E" stroke-width="2" stroke-dasharray="8 6 12 6">
       <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite" />
    </circle>
    <use href="#hex" x="0" y="0" stroke="#163A5E" />
    <circle cx="0" cy="0" r="4" fill="#00F0FF" filter="url(#neon)"/>
  </g>

  <!-- HEXAGON NODES & INNER GLOWS -->
  <!-- Homelab -->
  <use href="#hex" x="250" y="300" stroke="#FF8800" filter="url(#neon)"/>
  <circle cx="250" cy="300" r="6" fill="#FF8800" filter="url(#neon)"/>
  
  <!-- 9enjin -->
  <use href="#hex" x="750" y="150" stroke="#00F0FF" filter="url(#neon)"/>
  <circle cx="750" cy="150" r="5" fill="#00F0FF" filter="url(#neon)"/>
  
  <!-- 10 Year Series -->
  <use href="#hex" x="750" y="300" stroke="#B800FF" filter="url(#neon)"/>
  <circle cx="750" cy="300" r="5" fill="#B800FF" filter="url(#neon)"/>
  
  <!-- Foremost WMS -->
  <use href="#hex" x="750" y="450" stroke="#00F0FF" filter="url(#neon)"/>
  <circle cx="750" cy="450" r="5" fill="#00F0FF" filter="url(#neon)"/>

  <!-- NODE TEXT LABELS -->
  <!-- Homelab -->
  <text x="250" y="240" fill="#FFFFFF" font-size="16" font-weight="bold" text-anchor="middle" filter="url(#neon)">FEDORA HOMELAB</text>
  <text x="250" y="258" fill="#FF8800" font-size="11" text-anchor="middle" letter-spacing="1">DOCKER / CGROUPS V2</text>
  
  <!-- 9enjin -->
  <text x="780" y="145" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="start" filter="url(#neon)">9ENJIN</text>
  <text x="780" y="160" fill="#00F0FF" font-size="10" text-anchor="start">ECOSYSTEM NODE</text>
  
  <!-- 10 Year Series -->
  <text x="780" y="295" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="start" filter="url(#neon)">10 YEAR SERIES</text>
  <text x="780" y="310" fill="#B800FF" font-size="10" text-anchor="start">FLUTTER / FIREBASE</text>
  
  <!-- Foremost WMS -->
  <text x="780" y="445" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="start" filter="url(#neon)">FOREMOST WMS</text>
  <text x="780" y="460" fill="#00F0FF" font-size="10" text-anchor="start">PREDICTIVE ANALYTICS</text>

  <!-- ANIMATED TERMINAL LOGS (Bottom Left) -->
  <g font-size="10" fill="#00F0FF" font-family="monospace">
    <text x="40" y="480" opacity="0">
       > ESTABLISHING SECURE FEDORA KERNEL... [OK]
       <animate attributeName="opacity" values="0; 1; 1; 0" keyTimes="0; 0.01; 0.95; 1" dur="10s" repeatCount="indefinite"/>
    </text>
    <text x="40" y="495" opacity="0">
       > MOUNTING DOCKER VOLUMES AND CGROUPS V2... [OK]
       <animate attributeName="opacity" values="0; 0; 1; 1; 0" keyTimes="0; 0.15; 0.16; 0.95; 1" dur="10s" repeatCount="indefinite"/>
    </text>
    <text x="40" y="510" opacity="0">
       > DEPLOYING 9ENJIN MULTI-SIDED ECOSYSTEM... [OK]
       <animate attributeName="opacity" values="0; 0; 1; 1; 0" keyTimes="0; 0.30; 0.31; 0.95; 1" dur="10s" repeatCount="indefinite"/>
    </text>
    <text x="40" y="525" opacity="0">
       > CALCULATING FOREMOST WMS EOQ FORECASTS... [OK]
       <animate attributeName="opacity" values="0; 0; 1; 1; 0" keyTimes="0; 0.45; 0.46; 0.95; 1" dur="10s" repeatCount="indefinite"/>
    </text>
    <text x="40" y="540" opacity="0">
       > INITIALIZING 10 YEAR SERIES APP MATRIX... [OK]
       <animate attributeName="opacity" values="0; 0; 1; 1; 0" keyTimes="0; 0.60; 0.61; 0.95; 1" dur="10s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- CORNER HUD BRACKETS -->
  <g fill="none" stroke="#163A5E" stroke-width="3">
    <path d="M 20,40 L 20,20 L 40,20" />
    <path d="M 980,40 L 980,20 L 960,20" />
    <path d="M 20,560 L 20,580 L 40,580" />
    <path d="M 980,560 L 980,580 L 960,580" />
  </g>
</svg>
